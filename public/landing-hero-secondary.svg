<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="560"><stop stop-color="#eef2ff"/><stop offset=".48" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="wa" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
  <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f472b6"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
  <linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="web" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#312e81" flood-opacity=".18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <style><![CDATA[
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(7px,-7px)}}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
    @keyframes dash{to{stroke-dashoffset:-60}}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    .float{animation:float 5s ease-in-out infinite}.float2{animation:float2 6s ease-in-out infinite}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .dash{stroke-dasharray:7 7;animation:dash 1.8s linear infinite}.pop{animation:pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  ]]></style>
</defs>
