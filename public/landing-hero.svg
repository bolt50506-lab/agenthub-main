<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">AgentHub AI business automation</title>
<desc id="desc">AgentHub AI connects WhatsApp, Instagram, Facebook and website chat to AI conversations, lead capture, appointments and automatic follow-ups.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a18"/><stop offset="0.55" stop-color="#11152d"/><stop offset="1" stop-color="#071827"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18203d"/><stop offset="1" stop-color="#0d1328"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="wa" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="34"/></filter>
</defs>
<rect width="1200" height="820" rx="40" fill="url(#bg)"/>
<circle cx="1020" cy="90" r="250" fill="#7c3aed" opacity="0.18" filter="url(#glow)"/>
<circle cx="180" cy="720" r="230" fill="#06b6d4" opacity="0.10" filter="url(#glow)"/>

<!-- ambient network -->
<g opacity="0.22" stroke="#64748b" stroke-width="1">
  <path d="M70 170L1130 650"/><path d="M100 650L1100 170"/><path d="M600 70V750"/>
  <circle cx="150" cy="205" r="3" fill="#22d3ee"/><circle cx="1040" cy="600" r="3" fill="#8b5cf6"/><circle cx="920" cy="170" r="3" fill="#22d3ee"/>
</g>

<!-- main product frame -->
<g filter="url(#shadow)">
  <rect x="105" y="70" width="990" height="680" rx="32" fill="#0b1023" stroke="#303957" stroke-width="2"/>
  <rect x="105" y="70" width="990" height="76" rx="32" fill="#111832"/>
  <circle cx="138" cy="108" r="6" fill="#fb7185"/><circle cx="158" cy="108" r="6" fill="#fbbf24"/><circle cx="178" cy="108" r="6" fill="#34d399"/>
  <rect x="225" y="91" width="185" height="34" rx="17" fill="#19213d" stroke="#374268"/>
  <circle cx="247" cy="108" r="6" fill="#22c55e"/><text x="262" y="113" fill="#d1fae5" font-family="Arial,sans-serif" font-size="11" font-weight="700">AI OPERATOR ONLINE</text>
  <text x="925" y="113" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">AgentHub</text><text x="1001" y="113" fill="#67e8f9" font-family="Arial,sans-serif" font-size="12" font-weight="700">AI</text>

  <!-- channels -->
  <rect x="130" y="170" width="220" height="555" rx="22" fill="#080d20" stroke="#27304e"/>
  <text x="155" y="204" fill="#64748b" font-family="Arial,sans-serif" font-size="10" font-weight="700">CONNECTED CHANNELS</text>

  <rect x="148" y="225" width="184" height="68" rx="16" fill="#10281f" stroke="#166534"/>
  <circle cx="177" cy="259" r="17" fill="url(#wa)"/><text x="171" y="265" fill="white" font-family="Arial,sans-serif" font-size="16" font-weight="700">W</text>
  <text x="202" y="256" fill="#bbf7d0" font-family="Arial,sans-serif" font-size="12" font-weight="700">WhatsApp</text><text x="202" y="274" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Sales and support</text>

  <rect x="148" y="305" width="184" height="68" rx="16" fill="#28102d" stroke="#86198f"/>
  <circle cx="177" cy="339" r="17" fill="#d946ef"/><text x="169" y="346" fill="white" font-family="Arial,sans-serif" font-size="18">@</text>
  <text x="202" y="336" fill="#f5d0fe" font-family="Arial,sans-serif" font-size="12" font-weight="700">Instagram</text><text x="202" y="354" fill="#64748b" font-family="Arial,sans-serif" font-size="9">DM automation</text>

  <rect x="148" y="385" width="184" height="68" rx="16" fill="#101d38" stroke="#2563eb"/>
  <circle cx="177" cy="419" r="17" fill="#2563eb"/><text x="172" y="426" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="700">f</text>
  <text x="202" y="416" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="12" font-weight="700">Facebook</text><text x="202" y="434" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Messenger</text>

  <rect x="148" y="465" width="184" height="68" rx="16" fill="#171530" stroke="#4f46e5"/>
  <circle cx="177" cy="499" r="17" fill="#6366f1"/><text x="168" y="506" fill="white" font-family="Arial,sans-serif" font-size="15">WEB</text>
  <text x="202" y="496" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="12" font-weight="700">Website</text><text x="202" y="514" fill="#64748b" font-family="Arial,sans-serif" font-size="9">24/7 chat</text>

  <rect x="148" y="555" width="184" height="145" rx="16" fill="#11172c" stroke="#27304e"/>
  <text x="168" y="582" fill="#64748b" font-family="Arial,sans-serif" font-size="9" font-weight="700">BUSINESS MEMORY</text>
  <text x="168" y="611" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11" font-weight="700">Products and prices</text>
  <text x="168" y="630" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Knowledge connected</text>
  <text x="168" y="659" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11" font-weight="700">Customer history</text>
  <text x="168" y="678" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Leads and appointments</text>

  <!-- AI workspace -->
  <rect x="372" y="170" width="698" height="555" rx="22" fill="url(#panel)" stroke="#27304e"/>
  <text x="402" y="208" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">One AI business operator</text>
  <text x="402" y="230" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Understands customers, checks business data and completes the next action.</text>

  <!-- conversation -->
  <rect x="402" y="258" width="318" height="62" rx="17" fill="#1a223b" stroke="#33405f"/>
  <text x="425" y="295" fill="#dbe4f0" font-family="Arial,sans-serif" font-size="12">Hi, what is your package price?</text>
  <path d="M720 289H766" stroke="#6366f1" stroke-width="3"/>
  <circle cx="742" cy="289" r="5" fill="#a78bfa"/>
  <rect x="766" y="250" width="278" height="78" rx="19" fill="url(#accent)"/>
  <text x="791" y="281" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="700">AI checks approved pricing</text>
  <text x="791" y="302" fill="#e0e7ff" font-family="Arial,sans-serif" font-size="10">Then replies in the customer's language.</text>

  <text x="402" y="367" fill="#64748b" font-family="Arial,sans-serif" font-size="10" font-weight="700">AUTOMATIC BUSINESS ACTIONS</text>

  <!-- action cards -->
  <rect x="402" y="390" width="195" height="118" rx="18" fill="#101c35" stroke="#2563eb"/>
  <circle cx="432" cy="424" r="16" fill="#172554"/><path d="M424 424l6 6 12-14" stroke="#60a5fa" stroke-width="3" fill="none"/>
  <text x="457" y="429" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="11" font-weight="700">Lead captured</text>
  <text x="424" y="458" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Name, phone and interest</text>
  <text x="424" y="484" fill="#60a5fa" font-family="Arial,sans-serif" font-size="8" font-weight="700">READY FOR FOLLOW-UP</text>

  <rect x="616" y="390" width="195" height="118" rx="18" fill="#10281f" stroke="#16a34a"/>
  <circle cx="646" cy="424" r="16" fill="#052e1b"/><path d="M638 424h16M646 416v16" stroke="#4ade80" stroke-width="3"/>
  <text x="671" y="429" fill="#bbf7d0" font-family="Arial,sans-serif" font-size="11" font-weight="700">Appointment booked</text>
  <text x="638" y="458" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Tomorrow, 4:30 PM</text>
  <text x="638" y="484" fill="#4ade80" font-family="Arial,sans-serif" font-size="8" font-weight="700">CONFIRMATION SENT</text>

  <rect x="830" y="390" width="214" height="118" rx="18" fill="#1b1534" stroke="#7c3aed"/>
  <circle cx="860" cy="424" r="16" fill="#2e1065"/><path d="M852 424h16M860 416v16" stroke="#a78bfa" stroke-width="3"/>
  <text x="885" y="429" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="11" font-weight="700">Follow-up queued</text>
  <text x="852" y="458" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Automatic re-engagement</text>
  <text x="852" y="484" fill="#a78bfa" font-family="Arial,sans-serif" font-size="8" font-weight="700">NO LEAD LEFT BEHIND</text>

  <!-- live flow -->
  <rect x="402" y="535" width="642" height="165" rx="18" fill="#0b1227" stroke="#27304e"/>
  <text x="427" y="564" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10" font-weight="700">LIVE AUTOMATION FLOW</text>
  <line x1="460" y1="613" x2="986" y2="613" stroke="#33405f" stroke-width="3"/>
  <circle cx="460" cy="613" r="10" fill="#22c55e"/><circle cx="635" cy="613" r="10" fill="#8b5cf6"/><circle cx="810" cy="613" r="10" fill="#22d3ee"/><circle cx="986" cy="613" r="10" fill="#f59e0b"/>
  <text x="427" y="646" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">Message received</text>
  <text x="596" y="646" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">AI understands</text>
  <text x="780" y="646" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">Action completed</text>
  <text x="955" y="646" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">Follow up</text>
  <text x="427" y="678" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Customer support</text>
  <text x="596" y="678" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Business knowledge</text>
  <text x="780" y="678" fill="#64748b" font-family="Arial,sans-serif" font-size="9">CRM + calendar</text>
  <text x="955" y="678" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Automatic</text>
</g>

<!-- foreground outcome chip -->
<rect x="44" y="118" width="190" height="62" rx="20" fill="#111a31" stroke="#33405f"/>
<circle cx="70" cy="149" r="13" fill="#22c55e"/><path d="M64 149l5 5 8-10" stroke="white" stroke-width="2.5" fill="none"/>
<text x="94" y="146" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="700">BUSINESS AUTOMATION</text>
<text x="94" y="163" fill="#67e8f9" font-family="Arial,sans-serif" font-size="9">Running across every channel</text>
</svg>
