<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="820"><stop stop-color="#080b1c"/><stop offset=".52" stop-color="#0d1028"/><stop offset="1" stop-color="#071522"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset=".48" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <linearGradient id="trial" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".48"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="32"/></filter>
  <filter id="soft"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".4"/></filter>
  <style>
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes float2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(1deg)}}
    @keyframes pulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes dash{to{stroke-dashoffset:-70}}
    @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
    .float{animation:float 5s ease-in-out infinite}
    .float2{animation:float2 6s ease-in-out infinite}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .dash{stroke-dasharray:8 8;animation:dash 1.8s linear infinite}
    .breathe{animation:breathe 2.4s ease-in-out infinite}
  </style>
</defs>

<rect width="1200" height="820" rx="44" fill="url(#bg)"/>
<circle cx="950" cy="90" r="250" fill="#7c3aed" opacity=".18" filter="url(#glow)"/>
<circle cx="300" cy="650" r="240" fill="#06b6d4" opacity=".10" filter="url(#glow)"/>
<circle cx="620" cy="390" r="300" fill="#6366f1" opacity=".07" filter="url(#glow)"/>

<!-- subtle network lines -->
<g opacity=".28" stroke="#64748b" stroke-width="1">
  <path d="M80 410H1110"/><path d="M600 80V730"/>
  <circle cx="150" cy="190" r="2" fill="#22d3ee"/><circle cx="1030" cy="650" r="2" fill="#8b5cf6"/><circle cx="920" cy="180" r="2" fill="#22d3ee"/><circle cx="260" cy="620" r="2" fill="#8b5cf6"/>
</g>

<!-- NEW product-in-context dashboard -->
<g class="float" filter="url(#shadow)">
  <rect x="150" y="82" width="940" height="650" rx="30" fill="#0f142b" stroke="#2a3154" stroke-width="2"/>
  <rect x="150" y="82" width="940" height="68" rx="30" fill="#11172f"/>
  <circle cx="180" cy="116" r="5" fill="#fb7185"/><circle cx="198" cy="116" r="5" fill="#fbbf24"/><circle cx="216" cy="116" r="5" fill="#34d399"/>
  <rect x="250" y="100" width="178" height="32" rx="16" fill="#171e3b" stroke="#30385e"/>
  <circle cx="270" cy="116" r="5" fill="#22c55e" class="pulse"/><text x="283" y="120" fill="#d1fae5" font-family="Arial" font-size="10" font-weight="700">AGENT ONLINE</text>
  <text x="875" y="120" fill="#94a3b8" font-family="Arial" font-size="10">AgentHub</text><text x="950" y="120" fill="#67e8f9" font-family="Arial" font-size="10" font-weight="700">AI</text>

  <!-- left channel rail -->
  <rect x="174" y="174" width="205" height="530" rx="20" fill="#0b1024" stroke="#252d4d"/>
  <text x="198" y="207" fill="#64748b" font-family="Arial" font-size="10" font-weight="700">LIVE CHANNELS</text>

  <g class="breathe"><rect x="190" y="228" width="173" height="64" rx="15" fill="#10261e" stroke="#166534"/><circle cx="218" cy="260" r="16" fill="#22c55e"/><text x="213" y="266" fill="white" font-family="Arial" font-size="15" font-weight="700">W</text><text x="243" y="257" fill="#bbf7d0" font-family="Arial" font-size="12" font-weight="700">WhatsApp</text><text x="243" y="274" fill="#64748b" font-family="Arial" font-size="9">Sales + support</text></g>
  <rect x="190" y="304" width="173" height="64" rx="15" fill="#24102a" stroke="#701a75"/><circle cx="218" cy="336" r="16" fill="#d946ef"/><text x="211" y="342" fill="white" font-family="Arial" font-size="15" font-weight="700">◎</text><text x="243" y="333" fill="#f5d0fe" font-family="Arial" font-size="12" font-weight="700">Instagram</text><text x="243" y="350" fill="#64748b" font-family="Arial" font-size="9">DM automation</text>
  <rect x="190" y="380" width="173" height="64" rx="15" fill="#101d35" stroke="#1d4ed8"/><circle cx="218" cy="412" r="16" fill="#2563eb"/><text x="214" y="418" fill="white" font-family="Arial" font-size="15" font-weight="700">f</text><text x="243" y="409" fill="#bfdbfe" font-family="Arial" font-size="12" font-weight="700">Facebook</text><text x="243" y="426" fill="#64748b" font-family="Arial" font-size="9">Messenger</text>
  <rect x="190" y="456" width="173" height="64" rx="15" fill="#15132f" stroke="#4338ca"/><circle cx="218" cy="488" r="16" fill="#6366f1"/><text x="211" y="494" fill="white" font-family="Arial" font-size="14">⌘</text><text x="243" y="485" fill="#c7d2fe" font-family="Arial" font-size="12" font-weight="700">Website</text><text x="243" y="502" fill="#64748b" font-family="Arial" font-size="9">24/7 chat</text>
  <rect x="190" y="548" width="173" height="132" rx="15" fill="#11172f" stroke="#252d4d"/><text x="208" y="575" fill="#64748b" font-family="Arial" font-size="9" font-weight="700">BUSINESS MEMORY</text><text x="208" y="603" fill="#e2e8f0" font-family="Arial" font-size="11" font-weight="700">Products & prices</text><text x="208" y="624" fill="#94a3b8" font-family="Arial" font-size="9">Knowledge base connected</text><text x="208" y="652" fill="#e2e8f0" font-family="Arial" font-size="11" font-weight="700">Customer history</text><text x="208" y="673" fill="#94a3b8" font-family="Arial" font-size="9">Leads + appointments</text>

  <!-- center conversation -->
  <rect x="398" y="174" width="668" height="530" rx="20" fill="#0b1024" stroke="#252d4d"/>
  <text x="426" y="209" fill="#f8fafc" font-family="Arial" font-size="16" font-weight="700">AI business operator</text>
  <text x="426" y="229" fill="#64748b" font-family="Arial" font-size="9">Understands the message • checks your business data • takes the next action</text>
  <rect x="913" y="195" width="126" height="24" rx="12" fill="#10261e"/><circle cx="927" cy="207" r="4" fill="#22c55e" class="pulse"/><text x="937" y="211" fill="#86efac" font-family="Arial" font-size="8" font-weight="700">AUTOMATION LIVE</text>

  <rect x="426" y="252" width="310" height="56" rx="16" fill="#171e36" stroke="#283252"/><text x="450" y="286" fill="#cbd5e1" font-family="Arial" font-size="12">Hi, what is your package price?</text>
  <path d="M736 280H786" stroke="#6366f1" stroke-width="3" class="dash"/>
  <rect x="786" y="245" width="246" height="74" rx="18" fill="url(#brand)"/><text x="810" y="274" fill="white" font-family="Arial" font-size="11" font-weight="700">AI checks approved pricing</text><text x="810" y="294" fill="#e0e7ff" font-family="Arial" font-size="10">Then answers in the customer’s language.</text>

  <text x="426" y="360" fill="#64748b" font-family="Arial" font-size="9" font-weight="700">NEXT ACTIONS — AUTOMATIC</text>
  <g class="float2"><rect x="426" y="383" width="190" height="116" rx="17" fill="#101a31" stroke="#1d4ed8"/><circle cx="456" cy="416" r="15" fill="#172554"/><path d="M448 416l6 6 11-13" stroke="#60a5fa" stroke-width="2.5"/><text x="479" y="420" fill="#bfdbfe" font-family="Arial" font-size="11" font-weight="700">Lead captured</text><text x="448" y="450" fill="#64748b" font-family="Arial" font-size="9">Name + phone + interest</text><text x="448" y="475" fill="#60a5fa" font-family="Arial" font-size="8" font-weight="700">READY FOR FOLLOW-UP</text></g>
  <g class="float2"><rect x="636" y="383" width="190" height="116" rx="17" fill="#10261e" stroke="#166534"/><circle cx="666" cy="416" r="15" fill="#052e1b"/><path d="M657 416h18M666 407v18" stroke="#4ade80" stroke-width="2.5"/><text x="689" y="420" fill="#bbf7d0" font-family="Arial" font-size="11" font-weight="700">Appointment booked</text><text x="658" y="450" fill="#64748b" font-family="Arial" font-size="9">Tomorrow • 4:30 PM</text><text x="658" y="475" fill="#4ade80" font-family="Arial" font-size="8" font-weight="700">CONFIRMATION SENT</text></g>
  <g class="float2"><rect x="846" y="383" width="190" height="116" rx="17" fill="#17132f" stroke="#6d28d9"/><circle cx="876" cy="416" r="15" fill="#2e1065"/><path d="M867 416h18M876 407v18" stroke="#a78bfa" stroke-width="2.5"/><text x="899" y="420" fill="#ddd6fe" font-family="Arial" font-size="11" font-weight="700">Follow-up queued</text><text x="868" y="450" fill="#64748b" font-family="Arial" font-size="9">Automatic re-engagement</text><text x="868" y="475" fill="#a78bfa" font-family="Arial" font-size="8" font-weight="700">NO LEAD LEFT BEHIND</text></g>

  <!-- mini activity timeline -->
  <rect x="426" y="528" width="610" height="142" rx="17" fill="#10162d" stroke="#252d4d"/>
  <text x="450" y="554" fill="#94a3b8" font-family="Arial" font-size="9" font-weight="700">LIVE AGENT ACTIVITY</text>
  <circle cx="454" cy="581" r="5" fill="#22c55e"/><text x="470" y="585" fill="#cbd5e1" font-family="Arial" font-size="9">Customer message received</text><text x="935" y="585" fill="#64748b" font-family="Arial" font-size="8">just now</text>
  <circle cx="454" cy="610" r="5" fill="#8b5cf6"/><text x="470" y="614" fill="#cbd5e1" font-family="Arial" font-size="9">Business knowledge checked</text><text x="935" y="614" fill="#64748b" font-family="Arial" font-size="8">0.8s</text>
  <circle cx="454" cy="639" r="5" fill="#22d3ee"/><text x="470" y="643" fill="#cbd5e1" font-family="Arial" font-size="9">Reply + next action completed</text><text x="935" y="643" fill="#64748b" font-family="Arial" font-size="8">done</text>
</g>

<!-- separate floating 7-day trial badge, positioned on the LEFT so it never competes with the right-side WhatsApp widget -->
