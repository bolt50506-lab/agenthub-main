<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">AgentHub AI — the customer journey, automated</title>
<desc id="desc">A premium visual showing a customer message flowing through AgentHub AI and becoming a qualified lead, appointment and follow-up.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#15112e"/><stop offset="1" stop-color="#061c2c"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c084fc"/><stop offset=".48" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="wa" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ade80"/><stop offset="1" stop-color="#059669"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="35"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect width="1200" height="760" rx="40" fill="url(#bg)"/>
<circle cx="620" cy="370" r="270" fill="#7c3aed" opacity=".12" filter="url(#glow)"/>
<circle cx="1070" cy="90" r="180" fill="#06b6d4" opacity=".10" filter="url(#glow)"/>

<!-- top brand strip -->
<rect x="55" y="42" width="1090" height="64" rx="22" fill="#0b1023" stroke="#293553"/>
<circle cx="88" cy="74" r="17" fill="url(#core)"/><path d="M80 74l6 6 11-13" stroke="white" stroke-width="2.5" fill="none"/>
<text x="116" y="80" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="800">AgentHub</text><text x="208" y="80" fill="#67e8f9" font-family="Arial,sans-serif" font-size="18" font-weight="800">AI</text>
<text x="500" y="80" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">AI CUSTOMER OPERATIONS</text>
<rect x="935" y="59" width="185" height="30" rx="15" fill="#10251e" stroke="#166534"/><circle cx="955" cy="74" r="5" fill="#22c55e"/><text x="968" y="78" fill="#bbf7d0" font-family="Arial,sans-serif" font-size="9" font-weight="800">AUTOMATION LIVE</text>

<!-- STEP 1 -->
<text x="66" y="152" fill="#64748b" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">01  CUSTOMER MESSAGE</text>
<g filter="url(#shadow)">
<rect x="55" y="175" width="300" height="445" rx="30" fill="#0a1021" stroke="#303b5b"/>
<rect x="78" y="201" width="254" height="54" rx="17" fill="#10271e" stroke="#166534"/>
<circle cx="105" cy="228" r="15" fill="url(#wa)"/><text x="99" y="234" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="800">W</text><text x="128" y="224" fill="#dcfce7" font-family="Arial,sans-serif" font-size="11" font-weight="800">WhatsApp</text><text x="128" y="240" fill="#64748b" font-family="Arial,sans-serif" font-size="8">New conversation</text>
<rect x="78" y="273" width="254" height="92" rx="20" fill="#171e34"/><text x="99" y="303" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11">“I need your package price.</text><text x="99" y="321" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11">Can I book for tomorrow?”</text><text x="99" y="348" fill="#64748b" font-family="Arial,sans-serif" font-size="8">Customer • just now</text>
<rect x="78" y="384" width="254" height="54" rx="17" fill="#28102d" stroke="#86198f"/><circle cx="105" cy="411" r="14" fill="#d946ef"/><text x="98" y="416" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="800">IG</text><text x="128" y="408" fill="#f5d0fe" font-family="Arial,sans-serif" font-size="10" font-weight="800">Instagram DM</text><text x="128" y="423" fill="#64748b" font-family="Arial,sans-serif" font-size="8">Another lead waiting</text>
<rect x="78" y="455" width="254" height="54" rx="17" fill="#101e39" stroke="#2563eb"/><circle cx="105" cy="482" r="14" fill="#2563eb"/><text x="101" y="488" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="800">f</text><text x="128" y="479" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="10" font-weight="800">Facebook Messenger</text><text x="128" y="494" fill="#64748b" font-family="Arial,sans-serif" font-size="8">Customer question</text>
<rect x="78" y="530" width="254" height="63" rx="17" fill="#11182d" stroke="#273553"/><text x="99" y="556" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9" font-weight="700">WEBSITE CHAT</text><text x="99" y="575" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">4 channels feed one AI.</text>
</g>

<!-- arrows -->
<path d="M355 398H430" stroke="#8b5cf6" stroke-width="4"/><path d="M416 386l16 12-16 12" fill="none" stroke="#8b5cf6" stroke-width="4"/>

<!-- STEP 2 core -->
<text x="442" y="152" fill="#64748b" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">02  AGENTHUB THINKS</text>
<g filter="url(#shadow)">
<rect x="425" y="175" width="350" height="445" rx="32" fill="#0a0f22" stroke="#46527b" stroke-width="2"/>
<text x="457" y="218" fill="#f8fafc" font-family="Arial,sans-serif" font-size="17" font-weight="800">AI Business Operator</text><text x="457" y="239" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Not a chatbot. An agent that can act.</text>
<circle cx="600" cy="370" r="120" fill="#7c3aed" opacity=".08"/><circle cx="600" cy="370" r="91" fill="#111832" stroke="#6366f1" stroke-width="2"/><circle cx="600" cy="370" r="62" fill="url(#core)"/>
<path d="M570 370c7-25 39-38 60-23 18 13 20 40 5 56-17 18-48 15-62-5" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><circle cx="585" cy="361" r="4" fill="white"/><circle cx="615" cy="361" r="4" fill="white"/><path d="M585 383c10 8 20 8 30 0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="600" y="476" text-anchor="middle" fill="#ede9fe" font-family="Arial,sans-serif" font-size="13" font-weight="800">UNDERSTAND → DECIDE → ACT</text>
<rect x="454" y="505" width="292" height="43" rx="15" fill="#111a33" stroke="#303b5f"/><circle cx="475" cy="527" r="5" fill="#22c55e"/><text x="489" y="531" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="9">Checks products, pricing and customer history</text>
<rect x="454" y="559" width="292" height="43" rx="15" fill="#17132f" stroke="#6d28d9"/><circle cx="475" cy="581" r="5" fill="#a78bfa"/><text x="489" y="585" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="9">Chooses the right tool and next action</text>
</g>

<!-- arrows right -->
<path d="M780 398H850" stroke="#22d3ee" stroke-width="4"/><path d="M836 386l16 12-16 12" fill="none" stroke="#22d3ee" stroke-width="4"/>

<!-- STEP 3 outcomes -->
<text x="862" y="152" fill="#64748b" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">03  WORK COMPLETED</text>
<g filter="url(#shadow)">
<rect x="845" y="175" width="300" height="445" rx="30" fill="#0a1021" stroke="#303b5b"/>
<rect x="868" y="201" width="254" height="92" rx="21" fill="#0e2920" stroke="#166534"/><circle cx="901" cy="247" r="19" fill="#16a34a"/><path d="M892 247l7 8 14-17" stroke="white" stroke-width="3" fill="none"/><text x="930" y="241" fill="#dcfce7" font-family="Arial,sans-serif" font-size="12" font-weight="800">Lead captured</text><text x="930" y="260" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Customer details saved</text><text x="890" y="281" fill="#4ade80" font-family="Arial,sans-serif" font-size="8" font-weight="800">READY FOR SALES</text>
<rect x="868" y="312" width="254" height="92" rx="21" fill="#0e1d38" stroke="#2563eb"/><circle cx="901" cy="358" r="19" fill="#2563eb"/><path d="M892 358h18M901 349v18" stroke="white" stroke-width="3"/><text x="930" y="352" fill="#dbeafe" font-family="Arial,sans-serif" font-size="12" font-weight="800">Appointment booked</text><text x="930" y="371" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Calendar + confirmation handled</text><text x="890" y="392" fill="#60a5fa" font-family="Arial,sans-serif" font-size="8" font-weight="800">CONFIRMED</text>
<rect x="868" y="423" width="254" height="92" rx="21" fill="#1c1535" stroke="#7c3aed"/><circle cx="901" cy="469" r="19" fill="#7c3aed"/><path d="M892 469h18M901 460v18" stroke="white" stroke-width="3"/><text x="930" y="463" fill="#ede9fe" font-family="Arial,sans-serif" font-size="12" font-weight="800">Follow-up scheduled</text><text x="930" y="482" fill="#64748b" font-family="Arial,sans-serif" font-size="9">AI re-engages automatically</text><text x="890" y="503" fill="#a78bfa" font-family="Arial,sans-serif" font-size="8" font-weight="800">NO LEAD LEFT BEHIND</text>
<rect x="868" y="534" width="254" height="59" rx="18" fill="url(#core)"/><text x="995" y="559" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="800">REAL BUSINESS RESULT</text><text x="995" y="577" text-anchor="middle" fill="#ede9fe" font-family="Arial,sans-serif" font-size="8">while your team focuses on customers</text>
</g>

<text x="600" y="696" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">MESSAGE IN  •  AI WORK  •  BUSINESS RESULT OUT</text>
</svg>
