<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="820"><stop stop-color="#f5f3ff"/><stop offset=".48" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset=".48" stop-color="#6366f1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="trial" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#312e81" flood-opacity=".18"/></filter>
  <filter id="soft"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312e81" flood-opacity=".16"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  <style>
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes float2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-7px) rotate(1deg)}}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes dash{to{stroke-dashoffset:-70}}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
    .float{animation:float 5s ease-in-out infinite}
    .float2{animation:float2 6s ease-in-out infinite}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .dash{stroke-dasharray:8 8;animation:dash 1.8s linear infinite}
    .pop{animation:pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  </style>
</defs>

<rect width="1200" height="820" rx="44" fill="url(#bg)"/>
<circle cx="1010" cy="100" r="270" fill="#8b5cf6" opacity=".15" filter="url(#blur)"/>
<circle cx="120" cy="710" r="230" fill="#06b6d4" opacity=".12" filter="url(#blur)"/>
<circle cx="590" cy="420" r="320" fill="#6366f1" opacity=".045" filter="url(#blur)"/>

<!-- Main product window -->
<g class="float" filter="url(#shadow)">
  <rect x="70" y="82" width="1060" height="650" rx="34" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="70" y="82" width="1060" height="76" rx="34" fill="white"/>
  <circle cx="105" cy="120" r="6" fill="#fb7185"/><circle cx="127" cy="120" r="6" fill="#fbbf24"/><circle cx="149" cy="120" r="6" fill="#34d399"/>
  <text x="185" y="126" fill="#111827" font-family="Arial" font-size="21" font-weight="700">AgentHub</text>
  <text x="275" y="126" fill="#6366f1" font-family="Arial" font-size="21" font-weight="700">AI</text>
  <rect x="884" y="103" width="224" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="905" cy="120" r="6" fill="#10b981" class="pulse"/>
  <text x="920" y="125" fill="#047857" font-family="Arial" font-size="11" font-weight="700">AI WORKING 24/7</text>

  <!-- Channel rail -->
  <rect x="94" y="186" width="260" height="515" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="120" y="223" fill="#64748b" font-family="Arial" font-size="11" font-weight="700">CONNECTED CHANNELS</text>

  <g class="pop"><rect x="112" y="244" width="224" height="70" rx="17" fill="#ecfdf5"/><circle cx="143" cy="279" r="18" fill="#22c55e"/><text x="136" y="286" fill="white" font-family="Arial" font-size="18" font-weight="700">W</text><text x="171" y="275" fill="#166534" font-family="Arial" font-size="14" font-weight="700">WhatsApp</text><text x="171" y="294" fill="#64748b" font-family="Arial" font-size="10">Chat + voice + sales</text></g>
  <rect x="112" y="330" width="224" height="70" rx="17" fill="#fdf2f8"/><circle cx="143" cy="365" r="18" fill="#d946ef"/><text x="135" y="372" fill="white" font-family="Arial" font-size="17" font-weight="700">◎</text><text x="171" y="361" fill="#86198f" font-family="Arial" font-size="14" font-weight="700">Instagram</text><text x="171" y="380" fill="#64748b" font-family="Arial" font-size="10">DM automation</text>
  <rect x="112" y="416" width="224" height="70" rx="17" fill="#eff6ff"/><circle cx="143" cy="451" r="18" fill="#2563eb"/><text x="138" y="458" fill="white" font-family="Arial" font-size="18" font-weight="700">f</text><text x="171" y="447" fill="#1d4ed8" font-family="Arial" font-size="14" font-weight="700">Facebook</text><text x="171" y="466" fill="#64748b" font-family="Arial" font-size="10">Messenger automation</text>
  <rect x="112" y="502" width="224" height="70" rx="17" fill="#eef2ff"/><circle cx="143" cy="537" r="18" fill="#6366f1"/><text x="136" y="543" fill="white" font-family="Arial" font-size="18">⌘</text><text x="171" y="533" fill="#4338ca" font-family="Arial" font-size="14" font-weight="700">Website</text><text x="171" y="552" fill="#64748b" font-family="Arial" font-size="10">24/7 website chat</text>
  <rect x="112" y="598" width="224" height="76" rx="17" fill="white" stroke="#e2e8f0"/><text x="130" y="626" fill="#94a3b8" font-family="Arial" font-size="10" font-weight="700">ONE WORKSPACE</text><text x="130" y="650" fill="#334155" font-family="Arial" font-size="13" font-weight="700">Every customer conversation</text>

  <!-- AI action dashboard -->
  <rect x="378" y="186" width="728" height="515" rx="22" fill="white" stroke="#e2e8f0"/>
  <text x="408" y="223" fill="#0f172a" font-family="Arial" font-size="18" font-weight="700">AI conversation → business action</text>
  <rect x="915" y="203" width="159" height="28" rx="14" fill="#f0fdf4"/><circle cx="931" cy="217" r="5" fill="#22c55e" class="pulse"/><text x="942" y="221" fill="#15803d" font-family="Arial" font-size="9" font-weight="700">AUTOMATION LIVE</text>

  <rect x="408" y="254" width="350" height="58" rx="17" fill="#f1f5f9"/><text x="432" y="289" fill="#334155" font-family="Arial" font-size="13">Hi! What are your packages?</text>
  <rect x="685" y="330" width="390" height="78" rx="19" fill="url(#brand)"/><text x="712" y="362" fill="white" font-family="Arial" font-size="13" font-weight="600">Absolutely! I can share your packages</text><text x="712" y="384" fill="#e0e7ff" font-family="Arial" font-size="12">and book a suitable time for you.</text>
  <path d="M585 312V345H665" stroke="#6366f1" stroke-width="3" class="dash"/>

  <text x="408" y="450" fill="#64748b" font-family="Arial" font-size="11" font-weight="700">AGENTHUB HANDLES THE NEXT STEPS</text>
  <g class="pop"><rect x="408" y="476" width="205" height="128" rx="19" fill="#f8fafc" stroke="#bfdbfe"/><circle cx="443" cy="513" r="18" fill="#eff6ff"/><path d="M434 513l7 7 12-14" stroke="#2563eb" stroke-width="3" fill="none"/><text x="472" y="517" fill="#1e3a8a" font-family="Arial" font-size="13" font-weight="700">Lead captured</text><text x="432" y="548" fill="#64748b" font-family="Arial" font-size="10">Name • phone • interest</text><text x="432" y="573" fill="#6366f1" font-family="Arial" font-size="10" font-weight="700">FOLLOW-UP READY</text></g>
  <g class="pop"><rect x="635" y="476" width="205" height="128" rx="19" fill="#f8fafc" stroke="#bbf7d0"/><circle cx="670" cy="513" r="18" fill="#ecfdf5"/><path d="M660 513h20M670 503v20" stroke="#16a34a" stroke-width="3"/><text x="699" y="517" fill="#166534" font-family="Arial" font-size="13" font-weight="700">Appointment</text><text x="659" y="548" fill="#64748b" font-family="Arial" font-size="10">Tomorrow • 4:30 PM</text><text x="659" y="573" fill="#16a34a" font-family="Arial" font-size="10" font-weight="700">CONFIRMED</text></g>
  <g class="pop"><rect x="862" y="476" width="212" height="128" rx="19" fill="#f8fafc" stroke="#ddd6fe"/><circle cx="897" cy="513" r="18" fill="#f5f3ff"/><path d="M886 513h22M897 502v22" stroke="#7c3aed" stroke-width="3"/><text x="926" y="517" fill="#5b21b6" font-family="Arial" font-size="13" font-weight="700">Auto follow-up</text><text x="887" y="548" fill="#64748b" font-family="Arial" font-size="10">Queued automatically</text><text x="887" y="573" fill="#7c3aed" font-family="Arial" font-size="10" font-weight="700">NO LEAD LEFT BEHIND</text></g>
</g>

<!-- Left-side free trial badge: deliberately away from the customer chat widget -->
<g class="float2" filter="url(#soft)">
  <rect x="24" y="28" width="292" height="92" rx="26" fill="url(#trial)"/>
  <circle cx="61" cy="74" r="23" fill="white" opacity=".16"/>
  <path d="M61 58v16l10 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="64" fill="white" font-family="Arial" font-size="13" font-weight="700" letter-spacing="1">7 DAYS FREE</text>
  <text x="96" y="85" fill="#ede9fe" font-family="Arial" font-size="11" font-weight="600">Try your AI business agent</text>
  <text x="96" y="102" fill="#cffafe" font-family="Arial" font-size="9">No credit card required</text>
</g>

<!-- Floating business outcomes -->
<g class="float">
  <rect x="24" y="664" width="286" height="76" rx="22" fill="white" stroke="#bbf7d0" filter="url(#soft)"/>
  <circle cx="58" cy="702" r="18" fill="#dcfce7"/><circle cx="58" cy="702" r="7" fill="#22c55e" class="pulse"/>
  <text x="86" y="698" fill="#166534" font-family="Arial" font-size="11" font-weight="700">New WhatsApp lead</text><text x="86" y="716" fill="#64748b" font-family="Arial" font-size="9">AI replied • customer saved automatically</text>
</g>
<g class="float2">
  <rect x="852" y="30" width="324" height="76" rx="22" fill="white" stroke="#c7d2fe" filter="url(#soft)"/>
  <circle cx="889" cy="68" r="18" fill="#eef2ff"/><path d="M882 68l6 6 11-13" stroke="#6366f1" stroke-width="3"/>
  <text x="916" y="64" fill="#3730a3" font-family="Arial" font-size="11" font-weight="700">Appointment booked automatically</text><text x="916" y="82" fill="#64748b" font-family="Arial" font-size="9">Confirmation sent to customer</text>
</g>

<rect x="350" y="756" width="500" height="44" rx="22" fill="white" stroke="#cbd5e1" filter="url(#soft)"/>
<circle cx="380" cy="778" r="6" fill="#22c55e" class="pulse"/>
<text x="398" y="783" fill="#334155" font-family="Arial" font-size="11" font-weight="700">Message → AI → Lead → Booking → Follow-up</text>
</svg>