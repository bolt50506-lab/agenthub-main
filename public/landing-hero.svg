  <rect x="20" y="330" width="112" height="166" rx="28" fill="url(#trial)" stroke="#a78bfa" stroke-opacity=".45"/>
  <circle cx="76" cy="366" r="23" fill="white" opacity=".15"/>
  <path d="M76 349v17l10 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="412" text-anchor="middle" fill="white" font-family="Arial" font-size="17" font-weight="800">7 DAYS</text>
  <text x="76" y="434" text-anchor="middle" fill="#e0e7ff" font-family="Arial" font-size="11" font-weight="700">FREE TRIAL</text>
  <text x="76" y="456" text-anchor="middle" fill="#cffafe" font-family="Arial" font-size="8">No credit card</text>
  <text x="76" y="470" text-anchor="middle" fill="#cffafe" font-family="Arial" font-size="8">required</text>
</g>

<!-- outcome notification -->
<g class="float2" filter="url(#soft)">
  <rect x="850" y="28" width="300" height="62" rx="20" fill="#11172f" stroke="#33406a"/>
  <circle cx="881" cy="59" r="16" fill="#10261e"/><circle cx="881" cy="59" r="6" fill="#22c55e" class="pulse"/>
  <text x="907" y="56" fill="#bbf7d0" font-family="Arial" font-size="10" font-weight="700">New WhatsApp lead</text><text x="907" y="72" fill="#64748b" font-family="Arial" font-size="8">AI replied and saved the lead</text>
</g>

<rect x="350" y="756" width="500" height="44" rx="22" fill="#11172f" stroke="#30385e"/>
<circle cx="380" cy="778" r="6" fill="#22c55e" class="pulse"/>
<text x="398" y="783" fill="#cbd5e1" font-family="Arial" font-size="10" font-weight="700">Message → AI → Lead → Booking → Follow-up</text>
</svg>