<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">AgentHub AI — your business on autopilot</title>
<desc id="desc">A visual representation of AgentHub AI turning customer messages into conversations, sales, appointments and follow-ups across WhatsApp, Instagram, Facebook and website chat.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="0.5" stop-color="#10142b"/><stop offset="1" stop-color="#061b2b"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#10b981"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#8b5cf6" stop-opacity="0.45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.55"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
</defs>

<rect width="1200" height="820" rx="44" fill="url(#bg)"/>
<circle cx="1000" cy="90" r="330" fill="url(#orb)" filter="url(#blur)"/>
<circle cx="150" cy="730" r="280" fill="#06b6d4" opacity="0.09" filter="url(#blur)"/>

<!-- futuristic grid -->
<g opacity="0.11" stroke="#94a3b8">
  <path d="M0 140H1200M0 260H1200M0 380H1200M0 500H1200M0 620H1200M0 740H1200"/>
  <path d="M120 0V820M240 0V820M360 0V820M480 0V820M600 0V820M720 0V820M840 0V820M960 0V820M1080 0V820"/>
</g>

<!-- brand header -->
<g>
  <rect x="58" y="48" width="1084" height="72" rx="24" fill="#0c1125" stroke="#27304e"/>
  <circle cx="92" cy="84" r="20" fill="url(#violet)"/>
  <path d="M82 84l7 7 14-16" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124" y="90" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="800">AgentHub</text>
  <text x="221" y="90" fill="#67e8f9" font-family="Arial,sans-serif" font-size="19" font-weight="800">AI</text>
  <rect x="900" y="67" width="210" height="34" rx="17" fill="#10251e" stroke="#166534"/>
  <circle cx="923" cy="84" r="6" fill="#22c55e"/>
  <text x="938" y="89" fill="#bbf7d0" font-family="Arial,sans-serif" font-size="10" font-weight="800">YOUR BUSINESS IS LIVE</text>
</g>

<!-- left: incoming customer world -->
<g filter="url(#shadow)">
  <rect x="58" y="160" width="330" height="584" rx="30" fill="#0a1022" stroke="#2b3555" stroke-width="2"/>
  <text x="88" y="201" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="800">Customers are talking</text>
  <text x="88" y="223" fill="#64748b" font-family="Arial,sans-serif" font-size="10">AgentHub receives every conversation.</text>

  <!-- WhatsApp message -->
  <rect x="88" y="255" width="270" height="88" rx="22" fill="#102b21" stroke="#166534"/>
  <circle cx="119" cy="285" r="16" fill="#22c55e"/>
  <text x="113" y="291" fill="white" font-family="Arial,sans-serif" font-size="15" font-weight="800">W</text>
  <text x="145" y="282" fill="#bbf7d0" font-family="Arial,sans-serif" font-size="11" font-weight="800">WhatsApp</text>
  <text x="105" y="315" fill="#d1fae5" font-family="Arial,sans-serif" font-size="11">“What is your price and can I</text>
  <text x="105" y="332" fill="#d1fae5" font-family="Arial,sans-serif" font-size="11">book for tomorrow?”</text>

  <!-- Instagram -->
  <rect x="88" y="360" width="270" height="78" rx="22" fill="#28102d" stroke="#86198f"/>
  <circle cx="119" cy="389" r="16" fill="#d946ef"/>
  <text x="112" y="395" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="800">IG</text>
  <text x="145" y="387" fill="#f5d0fe" font-family="Arial,sans-serif" font-size="11" font-weight="800">Instagram DM</text>
  <text x="105" y="416" fill="#f5d0fe" font-family="Arial,sans-serif" font-size="10">“Is this available?”</text>

  <!-- Facebook -->
  <rect x="88" y="455" width="270" height="78" rx="22" fill="#101f3a" stroke="#2563eb"/>
  <circle cx="119" cy="484" r="16" fill="#2563eb"/>
  <text x="114" y="491" fill="white" font-family="Arial,sans-serif" font-size="17" font-weight="800">f</text>
  <text x="145" y="482" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="11" font-weight="800">Facebook Messenger</text>
  <text x="105" y="512" fill="#dbeafe" font-family="Arial,sans-serif" font-size="10">“Tell me about your service.”</text>

  <!-- Website -->
  <rect x="88" y="550" width="270" height="78" rx="22" fill="#151530" stroke="#4f46e5"/>
  <circle cx="119" cy="579" r="16" fill="#6366f1"/>
  <text x="108" y="584" fill="white" font-family="Arial,sans-serif" font-size="9" font-weight="800">WEB</text>
  <text x="145" y="577" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="11" font-weight="800">Website chat</text>
  <text x="105" y="607" fill="#e0e7ff" font-family="Arial,sans-serif" font-size="10">“Can someone help me?”</text>

  <rect x="88" y="657" width="270" height="54" rx="17" fill="#11182d" stroke="#27304e"/>
  <circle cx="110" cy="684" r="5" fill="#22d3ee"/>
  <text x="124" y="688" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">4 channels → one AI operator</text>
</g>

<!-- center AI brain / orchestration -->
<g filter="url(#shadow)">
  <rect x="424" y="160" width="352" height="584" rx="34" fill="#0c1228" stroke="#3b4770" stroke-width="2"/>
  <circle cx="600" cy="350" r="155" fill="#6366f1" opacity="0.08"/>
  <circle cx="600" cy="350" r="118" fill="#8b5cf6" opacity="0.08"/>

  <text x="476" y="205" fill="#64748b" font-family="Arial,sans-serif" font-size="10" font-weight="800">THE AI BUSINESS OPERATOR</text>
  <text x="476" y="235" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="800">Understands.</text>
  <text x="476" y="265" fill="#67e8f9" font-family="Arial,sans-serif" font-size="25" font-weight="800">Decides.</text>
  <text x="476" y="295" fill="#a78bfa" font-family="Arial,sans-serif" font-size="25" font-weight="800">Acts.</text>

  <!-- central AI node -->
  <circle cx="600" cy="392" r="78" fill="#111936" stroke="#6366f1" stroke-width="2"/>
  <circle cx="600" cy="392" r="58" fill="url(#violet)"/>
  <path d="M571 397c11-27 48-31 60-4 9 21-9 46-31 46-20 0-36-17-29-42z" fill="none" stroke="white" stroke-width="5" opacity="0.95"/>
  <circle cx="586" cy="387" r="4" fill="white"/><circle cx="614" cy="387" r="4" fill="white"/>
  <path d="M586 407c9 7 19 7 28 0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- orbit nodes -->
  <circle cx="475" cy="355" r="24" fill="#10281f" stroke="#22c55e"/>
  <text x="465" y="361" fill="#86efac" font-family="Arial,sans-serif" font-size="9" font-weight="800">DATA</text>
  <circle cx="725" cy="355" r="24" fill="#17132f" stroke="#a78bfa"/>
  <text x="713" y="361" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="9" font-weight="800">AI</text>
  <circle cx="525" cy="520" r="24" fill="#102238" stroke="#22d3ee"/>
  <text x="512" y="526" fill="#a5f3fc" font-family="Arial,sans-serif" font-size="9" font-weight="800">TOOLS</text>
  <circle cx="675" cy="520" r="24" fill="#24182a" stroke="#f472b6"/>
  <text x="664" y="526" fill="#fbcfe8" font-family="Arial,sans-serif" font-size="9" font-weight="800">VOICE</text>

  <path d="M499 364L547 382M701 364L653 382M540 501L572 452M660 501L628 452" stroke="#64748b" stroke-width="2" stroke-dasharray="6 7"/>

  <rect x="472" y="572" width="256" height="92" rx="22" fill="#111a34" stroke="#303b60"/>
  <text x="493" y="599" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9" font-weight="800">DECISION ENGINE</text>
  <text x="493" y="622" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11">Checks knowledge → chooses tool</text>
  <text x="493" y="642" fill="#67e8f9" font-family="Arial,sans-serif" font-size="10" font-weight="700">→ completes the business action</text>
</g>

<!-- right: outcomes -->
<g filter="url(#shadow)">
  <rect x="812" y="160" width="330" height="584" rx="30" fill="#0a1022" stroke="#2b3555" stroke-width="2"/>
  <text x="842" y="201" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="800">Work gets done</text>
  <text x="842" y="223" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Not just replies. Real business actions.</text>

  <rect x="842" y="255" width="270" height="106" rx="22" fill="#10281f" stroke="#166534"/>
  <circle cx="876" cy="291" r="18" fill="#22c55e"/>
  <path d="M868 291l6 6 11-14" stroke="white" stroke-width="3" fill="none"/>
  <text x="907" y="291" fill="#bbf7d0" font-family="Arial,sans-serif" font-size="12" font-weight="800">Lead captured</text>
  <text x="866" y="320" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Customer details saved automatically</text>
  <text x="866" y="341" fill="#4ade80" font-family="Arial,sans-serif" font-size="9" font-weight="800">READY FOR SALES</text>

  <rect x="842" y="382" width="270" height="106" rx="22" fill="#101f3a" stroke="#2563eb"/>
  <circle cx="876" cy="418" r="18" fill="#2563eb"/>
  <path d="M868 418h16M876 410v16" stroke="white" stroke-width="3"/>
  <text x="907" y="418" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="12" font-weight="800">Appointment booked</text>
  <text x="866" y="447" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Calendar checked and confirmation sent</text>
  <text x="866" y="468" fill="#60a5fa" font-family="Arial,sans-serif" font-size="9" font-weight="800">DONE</text>

  <rect x="842" y="509" width="270" height="106" rx="22" fill="#1b1534" stroke="#7c3aed"/>
  <circle cx="876" cy="545" r="18" fill="#7c3aed"/>
  <path d="M868 545h16M876 537v16" stroke="white" stroke-width="3"/>
  <text x="907" y="545" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="12" font-weight="800">Follow-up scheduled</text>
  <text x="866" y="574" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Re-engages customers automatically</text>
  <text x="866" y="595" fill="#a78bfa" font-family="Arial,sans-serif" font-size="9" font-weight="800">NO LEAD LEFT BEHIND</text>

  <rect x="842" y="638" width="270" height="73" rx="20" fill="url(#green)"/>
  <text x="866" y="668" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="800">ONE SYSTEM. EVERY CHANNEL.</text>
  <text x="866" y="690" fill="#dcfce7" font-family="Arial,sans-serif" font-size="9">Support • Sales • Appointments • Follow-up</text>
</g>

<!-- connecting flow arrows -->
<g fill="none" stroke="url(#cyan)" stroke-width="3" opacity="0.85">
  <path d="M388 430C402 430 407 430 424 430"/>
  <path d="M776 430C792 430 798 430 812 430"/>
</g>
<path d="M416 422l12 8-12 8M804 422l12 8-12 8" fill="none" stroke="#67e8f9" stroke-width="3"/>

<!-- small top-right promise -->
<rect x="850" y="126" width="250" height="28" rx="14" fill="#111a32" stroke="#33405f"/>
<circle cx="870" cy="140" r="4" fill="#22d3ee"/>
<text x="882" y="144" fill="#a5f3fc" font-family="Arial,sans-serif" font-size="9" font-weight="700">FROM MESSAGE → BUSINESS RESULT</text>
</svg>
