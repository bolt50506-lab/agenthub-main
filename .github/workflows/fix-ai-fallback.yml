name: Repair AI fallback delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch provider fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/ai/providers.ts')
          text = path.read_text()

          old = "const DEFAULT_PROVIDER_TIMEOUT_MS = 15000;"
          new = "const DEFAULT_PROVIDER_TIMEOUT_MS = 6000;"
          if old in text:
              text = text.replace(old, new, 1)

          old_block = """  const errors: string[];\n\n  for (\n    let index = 0;\n    index < providerConfigs.length;\n    index++\n  ) {\n    const config =\n      providerConfigs[index];"""

          if old_block not in text:
              old_block = """  const errors: string[] = [];\n\n  for (\n    let index = 0;\n    index < providerConfigs.length;\n    index++\n  ) {\n    const config =\n      providerConfigs[index];"""

          new_block = """  const errors: string[] = [];\n\n  // Hosted fallback safety net: if the dashboard only has Gemini enabled,\n  // still use Groq when its backend-only environment key is configured.\n  const effectiveProviderConfigs = [...providerConfigs];\n  if (\n    !effectiveProviderConfigs.some((config) => config.provider === 'groq') &&\n    getEnv('GROQ_API_KEY')\n  ) {\n    effectiveProviderConfigs.push({\n      provider: 'groq',\n      apiKey: getEnv('GROQ_API_KEY'),\n      model: getEnv('GROQ_MODEL') || 'openai/gpt-oss-120b',\n      temperature: request.temperature ?? 0.7,\n      maxTokens: request.maxTokens ?? 1024,\n    });\n  }\n\n  for (\n    let index = 0;\n    index < effectiveProviderConfigs.length;\n    index++\n  ) {\n    const config =\n      effectiveProviderConfigs[index];"""

          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif 'const effectiveProviderConfigs = [...providerConfigs];' not in text:
              raise SystemExit('Fallback loop block not found')

          text = text.replace("    providerConfigs[\n      providerConfigs.length - 1\n    ];", "    effectiveProviderConfigs[\n      effectiveProviderConfigs.length - 1\n    ];", 1)

          path.write_text(text)

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/providers.ts
          if git diff --cached --quiet; then
            echo "No provider changes needed"
          else
            git commit -m "fix: make Groq an automatic AI fallback"
            git push origin main
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-ai-fallback.yml
          git commit -m "chore: remove temporary AI fallback workflow"
          git push origin main