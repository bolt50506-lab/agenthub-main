name: Apply welcome message fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch WhatsApp incoming route
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/api/whatsapp/incoming/route.ts')
          s = p.read_text()

          old = "const { data: business, error: businessError } = await supabase.from('businesses').select('id, name, industry, description, website, phone, address, timezone, working_hours').eq('id', businessId).maybeSingle();"
          new = "const { data: business, error: businessError } = await supabase.from('businesses').select('id, name, industry, description, website, phone, address, timezone, working_hours, welcome_message').eq('id', businessId).maybeSingle();"
          if old not in s:
            raise SystemExit('business select pattern not found')
          s = s.replace(old, new, 1)

          old = "    conversation = existingConversation;\n    if (!conversation) {"
          new = "    const isFirstContact = !existingConversation;\n    const welcomeMessage = typeof business.welcome_message === 'string' ? business.welcome_message.trim() : '';\n    conversation = existingConversation;\n    if (!conversation) {"
          if old not in s:
            raise SystemExit('conversation pattern not found')
          s = s.replace(old, new, 1)

          old = "AGENT INFORMATION:\\nAgent Name: ${agent?.name || `${business.name} Assistant`}\\nAgent Purpose: ${agent?.purpose || 'Help customers and answer business questions'}\\nAgent Description: ${agent?.description || 'Not provided'}\\nCommunication Style: ${agent?.communication_style || 'Professional'}\\nPrimary Goal: ${agent?.primary_goal || 'Help customers effectively'}"
          new = "AGENT INFORMATION:\\nAgent Purpose: ${agent?.purpose || 'Help customers and answer business questions'}\\nAgent Description: ${agent?.description || 'Not provided'}\\nCommunication Style: ${agent?.communication_style || 'Professional'}\\nPrimary Goal: ${agent?.primary_goal || 'Help customers effectively'}"
          if old not in s:
            raise SystemExit('agent prompt pattern not found')
          s = s.replace(old, new, 1)

          old = "AGENT SETTINGS:\\nTone: ${agentSettings?.tone || 'professional'}\\nResponse Language Setting: ${agentSettings?.response_language || 'English'}\\nGreeting Behavior: ${agentSettings?.greeting_behavior || 'Natural'}\\nCustom Instructions: ${agentSettings?.custom_instructions || 'None'}"
          new = "AGENT SETTINGS:\\nTone: ${agentSettings?.tone || 'professional'}\\nResponse Language Setting: ${agentSettings?.response_language || 'English'}\\nGreeting Behavior: ${agentSettings?.greeting_behavior || 'Natural'}\\nCustom Instructions: ${agentSettings?.custom_instructions || 'None'}\\n\\nCUSTOM FIRST-CONTACT WELCOME:\\n${welcomeMessage || 'No custom welcome message configured.'}"
          if old not in s:
            raise SystemExit('settings prompt pattern not found')
          s = s.replace(old, new, 1)

          old = "- Do not restart an existing conversation with a generic greeting.\\n"
          new = "- Do not restart an existing conversation with a generic greeting.\\n- Never state, invent, or introduce yourself using an agent/person name. Never say \\\"I am [name]\\\", \\\"I'm [name]\\\", \\\"My name is [name]\\\", or equivalent Roman Urdu wording. Represent the business instead.\\n- If a custom first-contact welcome message is configured, do not create a second greeting; answer the customer's message naturally after the welcome is added by the application.\\n"
          if old not in s:
            raise SystemExit('rules pattern not found')
          s = s.replace(old, new, 1)

          old = "    // Resolve Random at the source once per reply. Railway receives the final\n"
          new = "    if (isFirstContact && welcomeMessage) {\n      finalReply = `${welcomeMessage}\\n\\n${finalReply}`.trim();\n    }\n\n    // Resolve Random at the source once per reply. Railway receives the final\n"
          if old not in s:
            raise SystemExit('final reply insertion point not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit patched route and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-welcome-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/whatsapp/incoming/route.ts .github/workflows/apply-welcome-fix.yml
          git diff --cached --quiet || git commit -m "fix: apply welcome message and suppress agent name"
          git push
